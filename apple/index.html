<!doctype html>
<html><head><meta charset="utf-8"><title>Яблоня</title>
<style>html,body{margin:0;background:#111}canvas{display:block;max-height:100vh;width:auto}</style></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script>
"use strict";
const W=1080,H=1920,FPS=60,DUR=55.6;
const OUT=document.getElementById('out'), octx=OUT.getContext('2d');
const S=document.createElement('canvas');S.width=W;S.height=H;const ctx=S.getContext('2d');
// ---------- utils
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const R=(t,a,b)=>clamp((t-a)/(b-a));
const sm=e=>e*e*(3-2*e);
const eio=e=>e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2;
const eout=e=>1-Math.pow(1-e,3);
const back=e=>{const c=1.9;return 1+(c+1)*Math.pow(e-1,3)+c*Math.pow(e-1,2)};
const spring=x=>x<=0?0:1-Math.exp(-5.5*x)*Math.cos(10*x);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`}
function mixA(a,b,t){const A=hex(a),B=hex(b);return A.map((v,i)=>lerp(v,B[i],t))}
const rgb=(c,al=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${al})`;
// keyed color track
function track(keys,t){ // keys [[t,'#hex'],...]
  if(t<=keys[0][0])return hex(keys[0][1]);
  for(let i=0;i<keys.length-1;i++){const [t0,c0]=keys[i],[t1,c1]=keys[i+1];if(t<=t1)return mixA(c0,c1,sm(R(t,t0,t1)))}
  return hex(keys[keys.length-1][1]);
}
const Y='#FFC93C',RED='#FF4D4D',GRN='#79E08A',WHITE='#FFFFFF';

// ---------- TREE MODEL
function makeTree(x0){return{x0,b:[]}}
function add(tr,o){const b=Object.assign({p:-1,at:1,ang:0,len:1,w0:.1,w1:.02,kind:'twig',bend:0,cuts:[],grow:null,hl:null,rm:null,ph:Math.random()*6},o);b.i=tr.b.length;tr.b.push(b);return b.i}
const R0=rng(7);
const OLD=makeTree(0);
const trunk=add(OLD,{ang:.02,len:2.0,w0:.44,w1:.30,kind:'trunk',bend:.02});
const leader=add(OLD,{p:trunk,at:1,ang:-.03,len:4.2,w0:.30,w1:.045,kind:'leader',bend:-.03});
const perevod=add(OLD,{p:leader,at:.40,ang:-.80,len:1.3,w0:.12,w1:.03,kind:'perevod',bend:-.10});
function twigs(tr,parent,specs,kind='twig'){for(const s of specs){const id=add(tr,{p:parent,at:s[0],ang:s[1],len:s[2],w0:s[3]||.04,w1:.008,kind,bend:(R0()-.5)*.3});
  if(s[2]>.45){add(tr,{p:id,at:.55,ang:s[1]+(R0()<.5?-.5:.5),len:s[2]*.45,w0:.018,w1:.006,kind,bend:(R0()-.5)*.3})}}}
twigs(OLD,perevod,[[.45,-.25,.55],[.8,-1.2,.45]]);
twigs(OLD,leader,[[.55,.55,.75],[.66,-.6,.7],[.78,.45,.6],[.9,-.35,.5]]);
const SK=[];
for(const [par,at,a,len] of [[trunk,.66,1.05,3.3],[trunk,.84,-1.02,3.2],[trunk,.99,.80,3.1],[leader,.10,-.78,3.0],[leader,.25,.66,2.9]]){
  const s=Math.sign(a);
  const id=add(OLD,{p:par,at,ang:a,len,w0:.17,w1:.035,kind:'skel',bend:.13*s});
  const out=add(OLD,{p:id,at:.60,ang:a+.42*s,len:1.15,w0:.06,w1:.014,kind:'outward',bend:.1*s});
  twigs(OLD,out,[[.45,a+.9*s,.45],[.75,a-.1*s,.4]]);
  const inw=add(OLD,{p:id,at:.42,ang:a-1.35*s,len:1.35,w0:.05,w1:.01,kind:'inward',bend:-.1*s});
  twigs(OLD,inw,[[.6,a-1.0*s,.35,.02]],'inward');
  twigs(OLD,id,[[.22,a+.7*s,.6],[.5,a-.55*s,.5],[.76,a+.55*s,.7],[.88,a-.4*s,.6],[.95,a+.2*s,.5]]);
  SK.push(id);
}
// crossing & dry
const CR1=add(OLD,{p:SK[0],at:.36,ang:-.55,len:1.7,w0:.055,w1:.01,kind:'cross',bend:.05});
twigs(OLD,CR1,[[.6,-.1,.4,.02]],'cross');
const CR2=add(OLD,{p:SK[3],at:.33,ang:.5,len:1.6,w0:.05,w1:.01,kind:'cross',bend:-.05});
twigs(OLD,CR2,[[.55,.1,.38,.02]],'cross');
const DRY1=add(OLD,{p:leader,at:.06,ang:.30,len:1.6,w0:.06,w1:.012,kind:'dry',bend:-.15});
twigs(OLD,DRY1,[[.4,.9,.5,.025],[.7,-.2,.45,.02]],'dry');
const DRY2=add(OLD,{p:trunk,at:.90,ang:-.32,len:1.45,w0:.055,w1:.012,kind:'dry',bend:.18});
twigs(OLD,DRY2,[[.5,-.95,.45,.02],[.75,.15,.4,.02]],'dry');

// ---- young trees
const YA=makeTree(9.4),YB=makeTree(11.0),YC=makeTree(12.6);
const yaT=add(YA,{ang:.01,len:1.35,w0:.045,w1:.016,kind:'young',bend:.02});
const ybT=add(YB,{ang:-.01,len:.8,w0:.06,w1:.04,kind:'young'});
const ybL=add(YB,{p:ybT,at:1,ang:.02,len:.62,w0:.04,w1:.01,kind:'young'});
const YBR=[];
[[.55,.95,.5],[.7,-.9,.48],[.82,.5,.42],[.92,-.45,.4]].forEach((s,k)=>{YBR.push(add(YB,{p:ybT,at:s[0],ang:s[1],len:s[2],w0:.025,w1:.008,kind:'young',bend:.12*Math.sign(s[1]),grow:[41.25+k*.28,41.25+k*.28+.55]}))});
const ycT=add(YC,{ang:.0,len:.85,w0:.07,w1:.05,kind:'young'});
const ycL=add(YC,{p:ycT,at:1,ang:-.02,len:1.15,w0:.05,w1:.012,kind:'young'});
[[.5,1.0,.62],[.65,-.95,.6],[.8,.6,.55],[.95,-.5,.52]].forEach(s=>add(YC,{p:ycT,at:s[0],ang:s[1],len:s[2],w0:.03,w1:.008,kind:'young',bend:.12*Math.sign(s[1])}));
[[.45,.85,.45],[.58,-.8,.42],[.7,.4,.36]].forEach((s,k)=>add(YC,{p:ycL,at:s[0],ang:s[1],len:s[2],w0:.022,w1:.006,kind:'young',bend:.1*Math.sign(s[1]),grow:[42.55+k*.25,42.55+k*.25+.5]}));
// leader of B grows too
YB.b[ybL].grow=[41.0,41.8];

// ---------- CUT SCHEDULES
// fall function: returns tau (seconds since cut) or null
function cutOnce(t0){return t=>t<t0?null:t-t0}
const CHOP=4.0-0.65; // 3.35
const RW0=7.45,RW1=8.45;
function cutChop(delay){const t0=CHOP+delay;return t=>{
  if(t<t0)return null; if(t<RW0)return t-t0; if(t<RW1){const k=eio(R(t,RW0,RW1));return (RW0-t0)*(1-k)} return null}}
const HOPS=[];
function addCut(tr,bi,c,f,o={}){tr.b[bi].cuts.push(Object.assign({c,f},o))}
// brutal chop (scene 1-2): marks placed by saw hops
const chopList=[[leader,.30],[SK[0],.30],[SK[1],.30],[SK[2],.30],[SK[3],.33],[SK[4],.30]];
chopList.forEach(([bi,c],k)=>{const hop=.55+k*.42;HOPS.push({bi,c,t:hop});addCut(OLD,bi,c,cutChop(k*.05),{mark:[hop+.18,CHOP],keep:true,chop:true})});
// year 1: leader above perevod
const Y1CUT=15.95;
addCut(OLD,leader,.43,cutOnce(Y1CUT),{mark:[14.55,Y1CUT]});
// year 2: removals
function rmWin(t0,t1){return t=>R(t,t0,t1)}
OLD.b.forEach(b=>{ if(b.kind==='inward'&&OLD.b[b.p].kind!=='inward'){b.hl=t=>t<19.5?0:t<23.2?.5+.5*Math.sin((t-19.5)*7):0; b.rm=rmWin(22.75+((b.i*7)%5)*.12,23.55+((b.i*7)%5)*.12)}
  if((b.kind==='cross'||b.kind==='dry')&&OLD.b[b.p].kind!==b.kind){b.hl=t=>t<21.95?0:t<23.3?.5+.5*Math.sin((t-21.95)*7):0;b.rm=rmWin(22.95+((b.i*3)%4)*.12,23.8+((b.i*3)%4)*.12)}});
// year 3: skeletal cuts at .63
SK.forEach((bi,k)=>addCut(OLD,bi,.63,cutOnce(27.85+k*.11),{mark:[26.9+k*.1,27.85+k*.11]}));
// young A: cut at 0.85m of 1.35
const YACUT=39.55;
addCut(YA,yaT,.85/1.35,cutOnce(YACUT),{mark:[38.45,YACUT]});

// sprouts (water shoots)
const SPR=[];{const r=rng(11);const hosts=[[trunk,.98],[leader,.15],[leader,.28]];SK.forEach(s=>{hosts.push([s,.08],[s,.16],[s,.24],[s,.29])});
 for(let k=0;k<34;k++){const h=hosts[k%hosts.length];SPR.push({bi:h[0],u:h[1]-r()*.04,len:.9+r()*1.0,lean:(r()-.5)*.35,d:r()*1.1,bend:(r()-.5)*.25})}}

// ---------- GEOMETRY
function geom(tr,t,sway=1){
  const G=[];
  for(const b of tr.b){
    let base,gl=1;
    if(b.grow) gl=back(R(t,b.grow[0],b.grow[1]));
    if(b.p<0) base=[tr.x0,0]; else {const P=G[b.p];base=bez(P,b.at)}
    const a=b.ang+sway*Math.sin(t*1.1+b.ph)*(b.kind==='twig'||b.kind==='outward'?.012:.003);
    const L=b.len*gl, d=[Math.sin(a),Math.cos(a)], n=[-Math.cos(a),Math.sin(a)];
    const T=[base[0]+d[0]*L,base[1]+d[1]*L];
    const C=[base[0]+d[0]*L*.5+n[0]*b.bend*L,base[1]+d[1]*L*.5+n[1]*b.bend*L];
    G.push({B:base,C,T,gl,L});
  }
  return G;
}
function bez(g,u){const v=1-u;return[v*v*g.B[0]+2*u*v*g.C[0]+u*u*g.T[0],v*v*g.B[1]+2*u*v*g.C[1]+u*u*g.T[1]]}
function tan(g,u){const x=2*(1-u)*(g.C[0]-g.B[0])+2*u*(g.T[0]-g.C[0]),y=2*(1-u)*(g.C[1]-g.B[1])+2*u*(g.T[1]-g.C[1]);const l=Math.hypot(x,y)||1;return[x/l,y/l]}

// ---------- CAMERA
const G0=geom(OLD,30,0);
const CLOSE=bez(G0[SK[2]],.63), CLOSEDIR=tan(G0[SK[2]],.63);
const CK=[
 [0.0, 1.3,3.9,185,.05],[3.2,.35,3.3,152,0],[5.6,-.45,3.0,140,-.025],[7.5,0,3.1,134,0],[9.6,.55,3.2,140,.018],
 [11.6,.15,3.5,152,0],[14.6,-.35,4.1,182,-.022],[17.0,-.7,3.45,150,0],[19.2,.3,3.2,145,.015],[22.0,0,3.05,150,-.01],
 [24.6,.5,3.05,146,.012],[27.6,1.05,3.0,166,.022],[29.6,.2,3.35,136,0],[31.25,.6,3.3,152,0],
 [32.35,CLOSE[0],CLOSE[1],2500,-.10],[34.7,CLOSE[0]+.004,CLOSE[1]-.002,2900,-.13],
 [35.9,5.0,2.0,330,-.03],[37.6,9.38,.98,500,-.02],[39.9,9.6,.92,520,.0],[41.0,10.9,1.05,470,.012],[42.2,11.05,1.1,440,0],[43.15,11.05,1.15,300,0],[43.8,11.1,1.25,290,0],
 [44.6,10.4,2.0,220,0],[46.2,7.6,3.0,128,-.02],[48.6,2.8,3.25,124,0],[50.6,.55,3.45,146,.012],[53.0,0,3.3,134,0],[55.6,-.1,3.2,127,-.005]];
function cam(t){
  const n=CK.length;let i=0;while(i<n-2&&t>CK[i+1][0])i++;
  const k0=CK[Math.max(i-1,0)],k1=CK[i],k2=CK[i+1],k3=CK[Math.min(i+2,n-1)];
  const h=k2[0]-k1[0],u=clamp((t-k1[0])/h);
  const out=[];
  for(let c=1;c<=4;c++){
    const f=v=>c===3?Math.log(v):v;
    const p1=f(k1[c]),p2=f(k2[c]),p0=f(k0[c]),p3=f(k3[c]);
    const m1=i===0?0:(p2-p0)/(k2[0]-k0[0])*h, m2=i+2>=n?0:(p3-p1)/(k3[0]-k1[0])*h;
    const u2=u*u,u3=u2*u;
    let v=(2*u3-3*u2+1)*p1+(u3-2*u2+u)*m1+(-2*u3+3*u2)*p2+(u3-u2)*m2;
    out.push(c===3?Math.exp(v):v);
  }
  // gentle handheld drift (scaled down in macro)
  const z=out[2], dz=Math.min(1,150/z);
  out[0]+=(Math.sin(t*.7)*.03+Math.sin(t*1.9)*.012)*dz; out[1]+=(Math.sin(t*.53+1)*.025)*dz; out[3]+=Math.sin(t*.4)*.004;
  return {x:out[0],y:out[1],z:out[2],r:out[3]};
}
let CAM;
function setWorld(c){ctx.setTransform(1,0,0,1,0,0);ctx.translate(W/2,H/2);ctx.rotate(c.r);ctx.scale(c.z,-c.z);ctx.translate(-c.x,-c.y)}
function w2s(x,y,c=CAM){const dx=(x-c.x)*c.z,dy=-(y-c.y)*c.z;return[W/2+dx*Math.cos(c.r)-dy*Math.sin(c.r),H/2+dx*Math.sin(c.r)+dy*Math.cos(c.r)]}
function layerCam(c,p){return{x:c.x*p,y:c.y*p+(1-p)*3.0,z:Math.min(150*Math.pow(c.z/150,p),c.z*3),r:c.r*p}}

// ---------- PRE-RENDERED LAYERS
function mkLayer(x0,x1,ppm,ytop,ybot,draw,blur){
  const w=Math.ceil((x1-x0)*ppm),h=Math.ceil((ytop-ybot)*ppm);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.translate(0,ytop*ppm);g.scale(ppm,-ppm);g.translate(-x0,0);draw(g);
  if(blur){const c2=document.createElement('canvas');c2.width=w;c2.height=h;const g2=c2.getContext('2d');g2.filter=`blur(${blur}px)`;g2.drawImage(c,0,0);return{c:c2,x0,ytop,ppm}}
  return{c,x0,ytop,ppm};
}
function hills(g,seed,base,amp,col,x0,x1){const r=rng(seed);g.fillStyle=col;g.beginPath();g.moveTo(x0,-40);
  const ph=[r()*6,r()*6,r()*6];for(let x=x0;x<=x1;x+=.25){const y=base+amp*(.55*Math.sin(x*.21+ph[0])+.3*Math.sin(x*.53+ph[1])+.15*Math.sin(x*1.3+ph[2]));g.lineTo(x,y)}g.lineTo(x1,-40);g.closePath();g.fill()}
let L_FAR,L_MID,L_TREES,L_FG,L_FARB,L_MIDB,L_TREESB;
function buildLayers(){
  const far=g=>{hills(g,3,1.6,1.1,'#9db5b8',-40,70)};
  const mid=g=>{hills(g,5,.9,.7,'#86a77f',-40,70)};
  const trees=g=>{const r=rng(9);g.fillStyle='#6f8f62';g.fillRect(-40,-40,110,40.15);
    for(let x=-38;x<68;x+=1.6+r()*1.8){const h=1.1+r()*1.4,w=.7+r()*.7;g.fillStyle=r()<.5?'#5d7f55':'#688a5a';g.beginPath();g.ellipse(x,h*.7,w,h*.55,0,0,7);g.fill();g.fillStyle='#4f3b2c';g.fillRect(x-.06,0,.12,h*.35)}
    // fence
    g.fillStyle='#c9b48f';for(let x=-38;x<68;x+=.5){g.fillRect(x,0,.09,.75)}g.fillRect(-40,.48,110,.06);g.fillRect(-40,.22,110,.06)};
  const fg=g=>{const r=rng(21);for(let x=-40;x<70;x+=.12){const h=.25+r()*.5;g.strokeStyle=r()<.5?'#4f7a3a':'#5f8c44';g.lineWidth=.05;g.beginPath();g.moveTo(x,-1.6);g.quadraticCurveTo(x+(r()-.5)*.2,-1.6+h*.6,x+(r()-.5)*.35,-1.6+h);g.stroke()}
    g.fillStyle='#4b7336';g.fillRect(-40,-6,110,4.45)};
  L_FAR=mkLayer(-40,70,40,6,-6,far,2.5); L_FARB=mkLayer(-40,70,40,6,-6,far,9);
  L_MID=mkLayer(-40,70,50,5,-6,mid,1.5); L_MIDB=mkLayer(-40,70,50,5,-6,mid,8);
  L_TREES=mkLayer(-40,70,60,4,-4,trees,1); L_TREESB=mkLayer(-40,70,60,4,-4,trees,8);
  L_FG=mkLayer(-40,70,60,-.6,-6.5,fg,7);
}
function drawLayer(L,p,c,al=1){if(al<=0)return;const lc=layerCam(c,p);setWorld(lc);ctx.globalAlpha=al;
  ctx.save();ctx.translate(L.x0,L.ytop);ctx.scale(1/L.ppm,-1/L.ppm);ctx.drawImage(L.c,0,0);ctx.restore();ctx.globalAlpha=1}
// snow sprite
const DOT=document.createElement('canvas');DOT.width=DOT.height=64;{const g=DOT.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.45,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}
const FLAKES=[];{const r=rng(33);for(let k=0;k<300;k++)FLAKES.push({x:r()*40-10,y:r()*12,p:.35+r()*1.4,s:r(),sp:.5+r()*.7})}

// ---------- DRAW TREE
const BARK={trunk:'#5a3e2a',leader:'#5f412c',perevod:'#654630',skel:'#5f412c',outward:'#6c4b33',twig:'#6e4d35',inward:'#6e4d35',cross:'#6e4d35',dry:'#9b948b',young:'#6d4a30'};
function seg(g,u0,u1,w0,w1,col,extra=0){
  const N=Math.max(4,Math.ceil((u1-u0)*12));const L=[],Rr=[];
  for(let k=0;k<=N;k++){const u=lerp(u0,u1,k/N),p=bez(g,u),d=tan(g,u),w=(lerp(w0,w1,u)*g.gl+extra)/2;L.push([p[0]-d[1]*w,p[1]+d[0]*w]);Rr.push([p[0]+d[1]*w,p[1]-d[0]*w])}
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);for(const q of L)ctx.lineTo(q[0],q[1]);for(let k=Rr.length-1;k>=0;k--)ctx.lineTo(Rr[k][0],Rr[k][1]);ctx.closePath();ctx.fill();
}
function hiLine(g,u0,u1,w0,w1,al){ctx.strokeStyle=`rgba(160,120,85,${.55*al})`;ctx.lineCap='round';
  const N=6;ctx.beginPath();for(let k=0;k<=N;k++){const u=lerp(u0,u1,k/N),p=bez(g,u),d=tan(g,u),w=lerp(w0,w1,u)*g.gl*.22;const q=[p[0]-d[1]*w,p[1]+d[0]*w];k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
  ctx.lineWidth=Math.max(lerp(w0,w1,.5)*g.gl*.22,.004);ctx.stroke()}
function fallX(tau,h,seed,fade){
  const g=7,hg=Math.max(h-.12,.05),tl=Math.sqrt(2*hg/g),om=(seed%2?1:-1)*(.5+(seed%5)*.15),vx=(seed%3-1)*.35;
  let dy,rot,dx,al=1;
  if(tau<tl){dy=-.5*g*tau*tau;rot=om*tau;dx=vx*tau}else{const k=tau-tl;dy=-hg+.10*Math.exp(-7*k)*Math.abs(Math.sin(11*k));rot=om*tl;dx=vx*tl;if(fade)al=1-R(k,.35,1.0)}
  return{dx,dy,rot,al};
}
function drawTree(tr,t,opt={}){
  const G=geom(tr,t);const b=tr.b;
  // per-branch states
  const alpha=new Array(b.length).fill(1),pale=new Array(b.length).fill(0),hl=new Array(b.length).fill(0),xf=new Array(b.length).fill(null),lim=new Array(b.length).fill(1);
  const marks=[],faces=[];
  for(const br of b){
    let a=1,pl=0,h=0,X=null;
    if(br.p>=0){a=alpha[br.p];pl=pale[br.p];h=hl[br.p];
      // inherit transform if attached beyond parent's active cut
      const P=b[br.p];X=xf[br.p];
      if(P._cut&&br.at>P._cut.c) X=P._cutX;
    }
    if(br.rm){const r=br.rm(t);a*=1-r;pl=Math.max(pl,clamp(r*2))}
    if(br.hl)h=Math.max(h,br.hl(t)*(br.rm?1-br.rm(t):1));
    alpha[br.i]=a;pale[br.i]=pl;hl[br.i]=h;xf[br.i]=X;
